{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Inscripciones - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/admin-dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="nav-logo me-2">
            <span>Administrar inscripciones</span>
        </a>

        <div>
            <a href="/admin-dashboard/" class="btn btn-outline-light me-2">Panel</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="section-title">Inscripción de estudiantes</h2>
    <p class="text-muted">Asigna estudiantes a cursos disponibles.</p>

    <div id="mensaje"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h5 class="fw-bold">Nueva inscripción</h5>

            <div class="row">

                <div class="col-md-5 mb-3">
                    <label class="form-label">Estudiante</label>
                    <select id="usuario" class="form-control"></select>
                </div>

                <div class="col-md-5 mb-3">
                    <label class="form-label">Curso</label>
                    <select id="curso" class="form-control"></select>
                </div>

                <div class="col-md-2 mb-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="crearInscripcion()">Inscribir</button>
                </div>

            </div>

        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <h5 class="fw-bold">Inscripciones registradas</h5>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Correo</th>
                        <th>Curso</th>
                        <th>Activa</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaInscripciones"></tbody>
            </table>

        </div>
    </div>

</div>

<script>
const token = localStorage.getItem("token");
const rol = localStorage.getItem("rol");

if (!token) {
    window.location.href = "/";
}

if (rol !== "admin") {
    window.location.href = "/dashboard/";
}

function cargarEstudiantes() {
    fetch("/api/estudiantes-disponibles/", {
        headers: {
            "Authorization": "Token " + token
        }
    })
    .then(response => response.json())
    .then(data => {
        const estudiantes = data.results || data;
        const select = document.getElementById("usuario");
        select.innerHTML = "";

        estudiantes.forEach(estudiante => {
            select.innerHTML += `
                <option value="${estudiante.id}">
                    ${estudiante.username} - ${estudiante.email || "Sin correo"}
                </option>
            `;
        });
    });
}

function cargarCursos() {
    fetch("/api/cursos/", {
        headers: {
            "Authorization": "Token " + token
        }
    })
    .then(response => response.json())
    .then(data => {
        const cursos = data.results || data;
        const select = document.getElementById("curso");
        select.innerHTML = "";

        cursos.forEach(curso => {
            select.innerHTML += `
                <option value="${curso.id}">
                    ${curso.nombre}
                </option>
            `;
        });
    });
}

function cargarInscripciones() {
    fetch("/api/inscripciones/", {
        headers: {
            "Authorization": "Token " + token
        }
    })
    .then(response => response.json())
    .then(data => {
        const inscripciones = data.results || data;
        const tabla = document.getElementById("tablaInscripciones");
        tabla.innerHTML = "";

        inscripciones.forEach(inscripcion => {
            tabla.innerHTML += `
                <tr>
                    <td>${inscripcion.id}</td>
                    <td>${inscripcion.usuario_username}</td>
                    <td>${inscripcion.usuario_email || ""}</td>
                    <td>${inscripcion.curso_nombre}</td>
                    <td>${inscripcion.activa ? "Sí" : "No"}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="eliminarInscripcion(${inscripcion.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `;
        });
    });
}

function crearInscripcion() {
    const usuario = document.getElementById("usuario").value;
    const curso = document.getElementById("curso").value;

    fetch("/api/inscripciones/", {
        method: "POST",
        headers: {
            "Authorization": "Token " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            usuario: usuario,
            curso: curso,
            activa: true
        })
    })
    .then(response => response.json())
    .then(data => {
        cargarInscripciones();
        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-success">
                Inscripción registrada correctamente.
            </div>
        `;
    });
}

function eliminarInscripcion(id) {
    if (!confirm("¿Deseas eliminar esta inscripción?")) {
        return;
    }

    fetch(`/api/inscripciones/${id}/`, {
        method: "DELETE",
        headers: {
            "Authorization": "Token " + token
        }
    })
    .then(() => cargarInscripciones());
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("rol");
    window.location.href = "/";
}

cargarEstudiantes();
cargarCursos();
cargarInscripciones();
</script>

</body>
</html>
