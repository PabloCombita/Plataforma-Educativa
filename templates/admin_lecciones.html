{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Lecciones - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/admin-dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="nav-logo me-2">
            <span>Administrar lecciones</span>
        </a>

        <div>
            <a href="/admin-dashboard/" class="btn btn-outline-light me-2">Panel</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="section-title">Gestión de lecciones</h2>
    <p class="text-muted">Crear, editar y eliminar lecciones asociadas a cursos.</p>

    <div id="mensaje"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="fw-bold">Formulario de lección</h5>

            <input type="hidden" id="leccionId">

            <div class="mb-3">
                <label class="form-label">Curso</label>
                <select id="curso" class="form-control"></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Título de la lección</label>
                <input type="text" id="titulo" class="form-control" placeholder="Ejemplo: Introducción a la química">
            </div>

            <div class="mb-3">
                <label class="form-label">Contenido</label>
                <textarea id="contenido" class="form-control" rows="4" placeholder="Contenido de la lección"></textarea>
            </div>

            <button type="button" class="btn btn-primary" onclick="guardarLeccion()">
                Guardar lección
            </button>

            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                Limpiar
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold">Lecciones registradas</h5>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Curso</th>
                            <th>Título</th>
                            <th>Contenido</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaLecciones"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
const token = localStorage.getItem("token");
const rol = localStorage.getItem("rol");

let leccionesGlobal = [];

if (!token) {
    window.location.href = "/";
}

if (rol !== "admin") {
    window.location.href = "/dashboard/";
}

function mostrarMensaje(tipo, texto) {
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-${tipo}">
            ${texto}
        </div>
    `;
}

function limpiarTexto(texto) {
    if (!texto) return "";
    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function recortarTexto(texto, limite = 80) {
    if (!texto) return "";
    const limpio = String(texto);
    if (limpio.length <= limite) return limpio;
    return limpio.substring(0, limite) + "...";
}

async function leerRespuesta(response) {
    const texto = await response.text();

    if (!texto) {
        return {};
    }

    try {
        return JSON.parse(texto);
    } catch (error) {
        console.error("Respuesta NO JSON del servidor:");
        console.error(texto);

        mostrarMensaje(
            "danger",
            "El servidor no devolvió JSON. Revisa la consola del navegador."
        );

        return null;
    }
}

async function cargarCursosSelect() {
    try {
        const response = await fetch("/api/cursos/", {
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await leerRespuesta(response);

        if (!data) return;

        const cursos = data.results || data;
        const select = document.getElementById("curso");

        select.innerHTML = "";

        if (!Array.isArray(cursos) || cursos.length === 0) {
            select.innerHTML = `<option value="">No hay cursos disponibles</option>`;
            return;
        }

        cursos.forEach(curso => {
            select.innerHTML += `
                <option value="${curso.id}">
                    ${limpiarTexto(curso.nombre)}
                </option>
            `;
        });

    } catch (error) {
        console.error("Error al cargar cursos:", error);
        mostrarMensaje("danger", "No se pudieron cargar los cursos.");
    }
}

async function cargarLecciones() {
    try {
        const response = await fetch("/api/lecciones/", {
            method: "GET",
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await leerRespuesta(response);

        if (!data) return;

        if (!response.ok) {
            console.error("Error al cargar lecciones:", data);
            mostrarMensaje("danger", "No se pudieron cargar las lecciones.");
            return;
        }

        const lecciones = data.results || data;
        leccionesGlobal = Array.isArray(lecciones) ? lecciones : [];

        const tabla = document.getElementById("tablaLecciones");
        tabla.innerHTML = "";

        if (leccionesGlobal.length === 0) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        No hay lecciones registradas.
                    </td>
                </tr>
            `;
            return;
        }

        leccionesGlobal.forEach(leccion => {
            const cursoId = leccion.curso;
            const cursoNombre = limpiarTexto(leccion.curso_nombre || leccion.nombre_curso || "Curso ID " + cursoId);
            const titulo = limpiarTexto(leccion.titulo || "");
            const contenidoCorto = limpiarTexto(recortarTexto(leccion.contenido || ""));

            tabla.innerHTML += `
                <tr>
                    <td>${leccion.id}</td>
                    <td>${cursoNombre}</td>
                    <td>${titulo}</td>
                    <td>${contenidoCorto}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editarLeccion(${leccion.id})">
                            Editar
                        </button>

                        <button class="btn btn-danger btn-sm" onclick="eliminarLeccion(${leccion.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        console.error("Error al cargar lecciones:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

async function guardarLeccion() {
    const id = document.getElementById("leccionId").value;
    const curso = document.getElementById("curso").value;
    const titulo = document.getElementById("titulo").value.trim();
    const contenido = document.getElementById("contenido").value.trim();

    if (!curso) {
        mostrarMensaje("warning", "Debes seleccionar un curso.");
        return;
    }

    if (!titulo) {
        mostrarMensaje("warning", "El título de la lección es obligatorio.");
        return;
    }

    const url = id ? `/api/lecciones/${id}/` : "/api/lecciones/";
    const method = id ? "PUT" : "POST";

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                "Authorization": "Token " + token,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                curso: Number(curso),
                titulo: titulo,
                contenido: contenido
            })
        });

        const data = await leerRespuesta(response);

        if (!response.ok) {
            console.error("Error del backend al guardar:", data);
            mostrarMensaje("danger", "No se pudo guardar la lección. Revisa la consola.");
            return;
        }

        mostrarMensaje("success", id ? "Lección actualizada correctamente." : "Lección creada correctamente.");
        limpiarFormulario();
        cargarLecciones();

    } catch (error) {
        console.error("Error al guardar lección:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function editarLeccion(id) {
    const leccion = leccionesGlobal.find(item => item.id === id);

    if (!leccion) {
        mostrarMensaje("danger", "No se encontró la lección seleccionada.");
        return;
    }

    document.getElementById("leccionId").value = leccion.id;
    document.getElementById("curso").value = leccion.curso;
    document.getElementById("titulo").value = leccion.titulo || "";
    document.getElementById("contenido").value = leccion.contenido || "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

async function eliminarLeccion(id) {
    if (!confirm("¿Deseas eliminar esta lección?")) {
        return;
    }

    try {
        const response = await fetch(`/api/lecciones/${id}/`, {
            method: "DELETE",
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 204) {
            mostrarMensaje("success", "Lección eliminada correctamente.");
            cargarLecciones();
            return;
        }

        const data = await leerRespuesta(response);

        console.error("Error al eliminar lección:", data);
        mostrarMensaje("danger", "No se pudo eliminar la lección. Revisa la consola o la terminal de Django.");

    } catch (error) {
        console.error("Error al eliminar lección:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function limpiarFormulario() {
    document.getElementById("leccionId").value = "";
    document.getElementById("titulo").value = "";
    document.getElementById("contenido").value = "";
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("rol");
    window.location.href = "/";
}

cargarCursosSelect();
cargarLecciones();
</script>

</body>
</html>
