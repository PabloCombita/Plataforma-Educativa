{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Evaluaciones - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/admin-dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="nav-logo me-2">
            <span>Administrar evaluaciones</span>
        </a>

        <div>
            <a href="/admin-dashboard/" class="btn btn-outline-light me-2">Panel</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="section-title">Gestión de evaluaciones</h2>
    <p class="text-muted">Crear, editar y eliminar preguntas asociadas a lecciones.</p>

    <div id="mensaje"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="fw-bold">Formulario de evaluación</h5>

            <input type="hidden" id="evaluacionId">

            <div class="mb-3">
                <label class="form-label">Lección</label>
                <select id="leccion" class="form-control"></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Pregunta</label>
                <textarea id="pregunta" class="form-control" rows="3" placeholder="Escribe la pregunta de evaluación"></textarea>
            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Opción A</label>
                    <input type="text" id="opcion_a" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Opción B</label>
                    <input type="text" id="opcion_b" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Opción C</label>
                    <input type="text" id="opcion_c" class="form-control">
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Respuesta correcta</label>
                <select id="respuesta_correcta" class="form-control">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

            <button type="button" class="btn btn-primary" onclick="guardarEvaluacion()">
                Guardar evaluación
            </button>

            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                Limpiar
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold">Evaluaciones registradas</h5>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Lección</th>
                            <th>Pregunta</th>
                            <th>A</th>
                            <th>B</th>
                            <th>C</th>
                            <th>Correcta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEvaluaciones"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
const token = localStorage.getItem("token");
const rol = localStorage.getItem("rol");

let evaluacionesGlobal = [];

if (!token) {
    window.location.href = "/";
}

if (rol !== "admin") {
    window.location.href = "/dashboard/";
}

function mostrarMensaje(tipo, texto) {
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-${tipo}">
            ${texto}
        </div>
    `;
}

function limpiarTexto(texto) {
    if (!texto) return "";
    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function recortarTexto(texto, limite = 70) {
    if (!texto) return "";
    const limpio = String(texto);
    if (limpio.length <= limite) return limpio;
    return limpio.substring(0, limite) + "...";
}

async function leerRespuesta(response) {
    const texto = await response.text();

    if (!texto) {
        return {};
    }

    try {
        return JSON.parse(texto);
    } catch (error) {
        console.error("Respuesta NO JSON del servidor:");
        console.error(texto);

        mostrarMensaje(
            "danger",
            "El servidor no devolvió JSON. Revisa la consola del navegador."
        );

        return null;
    }
}

async function cargarLeccionesSelect() {
    try {
        const response = await fetch("/api/lecciones/", {
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await leerRespuesta(response);

        if (!data) return;

        const lecciones = data.results || data;
        const select = document.getElementById("leccion");

        select.innerHTML = "";

        if (!Array.isArray(lecciones) || lecciones.length === 0) {
            select.innerHTML = `<option value="">No hay lecciones disponibles</option>`;
            return;
        }

        lecciones.forEach(leccion => {
            select.innerHTML += `
                <option value="${leccion.id}">
                    ${limpiarTexto(leccion.titulo || "Lección " + leccion.id)}
                </option>
            `;
        });

    } catch (error) {
        console.error("Error al cargar lecciones:", error);
        mostrarMensaje("danger", "No se pudieron cargar las lecciones.");
    }
}

async function cargarEvaluaciones() {
    try {
        const response = await fetch("/api/evaluaciones/", {
            method: "GET",
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await leerRespuesta(response);

        if (!data) return;

        if (!response.ok) {
            console.error("Error al cargar evaluaciones:", data);
            mostrarMensaje("danger", "No se pudieron cargar las evaluaciones.");
            return;
        }

        const evaluaciones = data.results || data;
        evaluacionesGlobal = Array.isArray(evaluaciones) ? evaluaciones : [];

        const tabla = document.getElementById("tablaEvaluaciones");
        tabla.innerHTML = "";

        if (evaluacionesGlobal.length === 0) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center text-muted">
                        No hay evaluaciones registradas.
                    </td>
                </tr>
            `;
            return;
        }

        evaluacionesGlobal.forEach(evaluacion => {
            const pregunta = limpiarTexto(recortarTexto(evaluacion.pregunta || ""));
            const opcionA = limpiarTexto(recortarTexto(evaluacion.opcion_a || "", 40));
            const opcionB = limpiarTexto(recortarTexto(evaluacion.opcion_b || "", 40));
            const opcionC = limpiarTexto(recortarTexto(evaluacion.opcion_c || "", 40));
            const leccionId = evaluacion.leccion;
            const leccionNombre = limpiarTexto(
                evaluacion.leccion_titulo ||
                evaluacion.nombre_leccion ||
                "Lección ID " + leccionId
            );

            tabla.innerHTML += `
                <tr>
                    <td>${evaluacion.id}</td>
                    <td>${leccionNombre}</td>
                    <td>${pregunta}</td>
                    <td>${opcionA}</td>
                    <td>${opcionB}</td>
                    <td>${opcionC}</td>
                    <td><strong>${evaluacion.respuesta_correcta || ""}</strong></td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editarEvaluacion(${evaluacion.id})">
                            Editar
                        </button>

                        <button class="btn btn-danger btn-sm" onclick="eliminarEvaluacion(${evaluacion.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        console.error("Error al cargar evaluaciones:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

async function guardarEvaluacion() {
    const id = document.getElementById("evaluacionId").value;
    const leccion = document.getElementById("leccion").value;
    const pregunta = document.getElementById("pregunta").value.trim();
    const opcion_a = document.getElementById("opcion_a").value.trim();
    const opcion_b = document.getElementById("opcion_b").value.trim();
    const opcion_c = document.getElementById("opcion_c").value.trim();
    const respuesta_correcta = document.getElementById("respuesta_correcta").value;

    if (!leccion) {
        mostrarMensaje("warning", "Debes seleccionar una lección.");
        return;
    }

    if (!pregunta) {
        mostrarMensaje("warning", "La pregunta es obligatoria.");
        return;
    }

    if (!opcion_a || !opcion_b || !opcion_c) {
        mostrarMensaje("warning", "Debes completar las tres opciones de respuesta.");
        return;
    }

    const url = id ? `/api/evaluaciones/${id}/` : "/api/evaluaciones/";
    const method = id ? "PUT" : "POST";

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                "Authorization": "Token " + token,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                leccion: Number(leccion),
                pregunta: pregunta,
                opcion_a: opcion_a,
                opcion_b: opcion_b,
                opcion_c: opcion_c,
                respuesta_correcta: respuesta_correcta
            })
        });

        const data = await leerRespuesta(response);

        if (!response.ok) {
            console.error("Error del backend al guardar:", data);
            mostrarMensaje("danger", "No se pudo guardar la evaluación. Revisa la consola.");
            return;
        }

        mostrarMensaje("success", id ? "Evaluación actualizada correctamente." : "Evaluación creada correctamente.");
        limpiarFormulario();
        cargarEvaluaciones();

    } catch (error) {
        console.error("Error al guardar evaluación:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function editarEvaluacion(id) {
    const evaluacion = evaluacionesGlobal.find(item => item.id === id);

    if (!evaluacion) {
        mostrarMensaje("danger", "No se encontró la evaluación seleccionada.");
        return;
    }

    document.getElementById("evaluacionId").value = evaluacion.id;
    document.getElementById("leccion").value = evaluacion.leccion;
    document.getElementById("pregunta").value = evaluacion.pregunta || "";
    document.getElementById("opcion_a").value = evaluacion.opcion_a || "";
    document.getElementById("opcion_b").value = evaluacion.opcion_b || "";
    document.getElementById("opcion_c").value = evaluacion.opcion_c || "";
    document.getElementById("respuesta_correcta").value = evaluacion.respuesta_correcta || "A";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

async function eliminarEvaluacion(id) {
    if (!confirm("¿Deseas eliminar esta evaluación?")) {
        return;
    }

    try {
        const response = await fetch(`/api/evaluaciones/${id}/`, {
            method: "DELETE",
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 204) {
            mostrarMensaje("success", "Evaluación eliminada correctamente.");
            cargarEvaluaciones();
            return;
        }

        const data = await leerRespuesta(response);

        console.error("Error al eliminar evaluación:", data);
        mostrarMensaje("danger", "No se pudo eliminar la evaluación. Revisa la consola o la terminal de Django.");

    } catch (error) {
        console.error("Error al eliminar evaluación:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function limpiarFormulario() {
    document.getElementById("evaluacionId").value = "";
    document.getElementById("pregunta").value = "";
    document.getElementById("opcion_a").value = "";
    document.getElementById("opcion_b").value = "";
    document.getElementById("opcion_c").value = "";
    document.getElementById("respuesta_correcta").value = "A";
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("rol");
    window.location.href = "/";
}

cargarLeccionesSelect();
cargarEvaluaciones();
</script>

</body>
</html>
