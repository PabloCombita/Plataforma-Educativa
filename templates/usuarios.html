{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="nav-logo me-2">
            <span>Plataforma Educativa</span>
        </a>

        <div>
            <a href="/dashboard/" class="btn btn-outline-light me-2">Dashboard</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="section-title">Usuarios</h2>
    <p class="text-muted">Listado de usuarios registrados en el sistema.</p>

    <div id="mensaje"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/";
}

fetch("/api/usuarios/usuarios/", {
    headers: {
        "Authorization": "Token " + token
    }
})
.then(response => {
    if (response.status === 401 || response.status === 403) {
        logout();
        return;
    }
    return response.json();
})
.then(data => {
    if (!data) return;

    const usuarios = data.results || data;
    const tabla = document.getElementById("tabla-usuarios");

    if (!Array.isArray(usuarios) || usuarios.length === 0) {
        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-info">
                No hay usuarios registrados.
            </div>
        `;
        return;
    }

    usuarios.forEach(usuario => {
        tabla.innerHTML += `
            <tr>
                <td>${usuario.id}</td>
                <td>${usuario.username || ""}</td>
                <td>${usuario.email || ""}</td>
                <td>${usuario.rol || "estudiante"}</td>
            </tr>
        `;
    });
})
.catch(error => {
    console.error("Error:", error);
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-danger">
            No se pudieron cargar los usuarios.
        </div>
    `;
});

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("rol");
    window.location.href = "/";
}
</script>

</body>
</html>
