<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma Educativa</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">📚</div>
            <h1 class="login-title">Bienvenido</h1>
            <p class="login-subtitle">Ingresa a tu plataforma educativa</p>
        </div>
        
        <div class="login-body">
            <form id="loginForm" onsubmit="return false;">
                <div class="form-group-modern">
                    <label class="form-label-modern" for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input-modern"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >
                </div>
                
                <div class="form-group-modern">
                    <label class="form-label-modern" for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input-modern"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="btn-modern btn-primary-modern" 
                    style="width: 100%; justify-content: center;"
                    onclick="login()"
                    id="loginButton"
                >
                    <span id="buttonText">Iniciar Sesión</span>
                </button>
                
                <div id="error" style="display: none;"></div>
            </form>
        </div>
    </div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";

// Auto-focus en el primer input
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('username').focus();
});

// Permitir Enter para submit
document.getElementById('username').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('password').focus();
    }
});

document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        login();
    }
});

function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorDiv = document.getElementById("error");
    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");
    
    // Validación básica
    if (!username || !password) {
        showError("Por favor completa todos los campos");
        return;
    }
    
    // Estado de loading
    loginButton.disabled = true;
    buttonText.innerHTML = '<span class="loading-spinner"></span> Verificando...';
    errorDiv.style.display = 'none';
    
    fetch(API_URL + "/api/token/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Login incorrecto");
        }
        return response.json();
    })
    .then(data => {
        if (data.token) {
            localStorage.setItem("token", data.token);
            
            // Mostrar éxito brevemente antes de redirigir
            buttonText.innerHTML = '✓ Acceso concedido';
            loginButton.style.background = 'var(--success)';
            
            setTimeout(() => {
                window.location.href = "/dashboard/";
            }, 800);
        } else {
            showError("Usuario o contraseña incorrectos");
            resetButton();
        }
    })
    .catch(error => {
        console.error(error);
        showError("No se pudo conectar con el servidor. Verifica tu conexión.");
        resetButton();
    });
}

function showError(message) {
    const errorDiv = document.getElementById("error");
    errorDiv.innerHTML = `
        <div class="alert-modern alert-error">
            <span>⚠️</span>
            <span>${message}</span>
        </div>
    `;
    errorDiv.style.display = 'block';
}

function resetButton() {
    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");
    loginButton.disabled = false;
    buttonText.textContent = "Iniciar Sesión";
    loginButton.style.background = '';
}
</script>

</body>
</html>
