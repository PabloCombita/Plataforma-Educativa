{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body class="login-bg">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card login-card shadow-lg p-4">

        <div class="text-center mb-4">
            <img src="{% static 'img/logo.png' %}" alt="Logo Plataforma Educativa" width="120" class="mb-3 rounded">
            <h3 class="fw-bold mb-1">Plataforma Educativa</h3>
            <p class="text-muted">Acceso al sistema</p>
        </div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Ingresar
            </button>

            <p id="mensaje" class="text-danger mt-3 text-center"></p>

        </form>

    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const mensaje = document.getElementById("mensaje");

    mensaje.innerText = "";

    fetch("http://127.0.0.1:8000/api/token/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("username", username);
            window.location.href = "/dashboard/";
        } else {
            mensaje.innerText = "Usuario o contraseña incorrectos";
        }
    })
    .catch(error => {
        console.error("Error:", error);
        mensaje.innerText = "Error al conectar con el servidor";
    });
});
</script>

</body>
</html>
