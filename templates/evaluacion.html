{% extends "base.html" %}

{% block title %}Evaluación - Plataforma Educativa{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="mb-4">
        <h2 class="fw-bold">Evaluación</h2>
        <p class="text-muted">Responde las preguntas disponibles para la lección seleccionada.</p>
    </div>

    <div id="mensaje" class="mb-3"></div>

    <div id="listaEvaluaciones" class="row"></div>

</div>

{% endblock %}

{% block scripts %}
<script>
verificarSesion();

const token = localStorage.getItem("token");
const leccionId = "{{ evaluacion_id }}";

fetch("http://127.0.0.1:8000/api/evaluaciones/?leccion=" + leccionId, {
    headers: {
        "Authorization": "Token " + token
    }
})
.then(response => {
    if (response.status === 401 || response.status === 403) {
        logout();
    }
    return response.json();
})
.then(data => {
    const contenedor = document.getElementById("listaEvaluaciones");
    const mensaje = document.getElementById("mensaje");

    const evaluaciones = data.results || data;

    if (!Array.isArray(evaluaciones) || evaluaciones.length === 0) {
        mensaje.innerHTML = `
            <div class="alert alert-info">
                No hay evaluaciones registradas para esta lección.
            </div>
        `;
        return;
    }

    evaluaciones.forEach(evaluacion => {
        contenedor.innerHTML += `
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm module-card">
                    <div class="card-body">
                        <h5 class="fw-bold">Pregunta</h5>
                        <p>${evaluacion.pregunta}</p>

                        <div class="list-group mb-3">
                            <button class="list-group-item list-group-item-action" onclick="responder(${evaluacion.id}, 'A')">
                                A. ${evaluacion.opcion_a}
                            </button>

                            <button class="list-group-item list-group-item-action" onclick="responder(${evaluacion.id}, 'B')">
                                B. ${evaluacion.opcion_b}
                            </button>

                            <button class="list-group-item list-group-item-action" onclick="responder(${evaluacion.id}, 'C')">
                                C. ${evaluacion.opcion_c}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
})
.catch(error => {
    console.error("Error:", error);
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-danger">
            No se pudieron cargar las evaluaciones.
        </div>
    `;
});

function responder(evaluacionId, respuesta) {
    fetch("http://127.0.0.1:8000/api/responder/", {
        method: "POST",
        headers: {
            "Authorization": "Token " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            evaluacion: evaluacionId,
            respuesta: respuesta
        })
    })
    .then(response => response.json())
    .then(data => {
        alert(data.mensaje || "Respuesta registrada");
    })
    .catch(error => {
        console.error("Error:", error);
        alert("No se pudo registrar la respuesta");
    });
}
</script>
{% endblock %}
