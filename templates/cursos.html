{% extends "base.html" %}

{% block title %}Cursos - Plataforma Educativa{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="mb-4">
        <h2 class="fw-bold">Cursos disponibles</h2>
        <p class="text-muted">Selecciona un curso para consultar sus lecciones y evaluaciones.</p>
    </div>

    <div id="mensaje" class="mb-3"></div>

    <div id="listaCursos" class="row"></div>

</div>

{% endblock %}

{% block scripts %}
<script>
verificarSesion();

const token = localStorage.getItem("token");

fetch("http://127.0.0.1:8000/api/cursos/", {
    headers: {
        "Authorization": "Token " + token
    }
})
.then(response => {
    if (response.status === 401 || response.status === 403) {
        logout();
    }
    return response.json();
})
.then(data => {
    const contenedor = document.getElementById("listaCursos");
    const mensaje = document.getElementById("mensaje");

    const cursos = data.results || data;

    if (!Array.isArray(cursos) || cursos.length === 0) {
        mensaje.innerHTML = `
            <div class="alert alert-info">
                No hay cursos registrados actualmente.
            </div>
        `;
        return;
    }

    cursos.forEach(curso => {
        contenedor.innerHTML += `
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100 module-card">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">${curso.nombre}</h5>
                        <p class="card-text text-muted">${curso.descripcion || "Sin descripción disponible."}</p>

                        <a href="/leccion/${curso.id}/" class="btn btn-primary btn-sm">
                            Ver lecciones
                        </a>
                    </div>
                </div>
            </div>
        `;
    });
})
.catch(error => {
    console.error("Error:", error);
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-danger">
            No se pudieron cargar los cursos.
        </div>
    `;
});
</script>
{% endblock %}
