{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Cursos - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/admin-dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="nav-logo me-2">
            <span>Administrar cursos</span>
        </a>

        <div>
            <a href="/admin-dashboard/" class="btn btn-outline-light me-2">Panel</a>
            <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="section-title">Gestión de cursos</h2>
    <p class="text-muted">Crear, editar y eliminar cursos.</p>

    <div id="mensaje"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="fw-bold">Formulario de curso</h5>

            <input type="hidden" id="cursoId">

            <div class="mb-3">
                <label class="form-label">Nombre del curso</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ejemplo: Química básica">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea id="descripcion" class="form-control" placeholder="Descripción del curso"></textarea>
            </div>

            <button type="button" class="btn btn-primary" onclick="guardarCurso()">
                Guardar curso
            </button>

            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                Limpiar
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold">Cursos registrados</h5>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Inscritos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCursos"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
const token = localStorage.getItem("token");
const rol = localStorage.getItem("rol");

if (!token) {
    window.location.href = "/";
}

if (rol !== "admin") {
    window.location.href = "/dashboard/";
}

function mostrarMensaje(tipo, texto) {
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-${tipo}">
            ${texto}
        </div>
    `;
}

function limpiarTexto(texto) {
    if (!texto) return "";
    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function leerRespuesta(response) {
    const texto = await response.text();

    try {
        return JSON.parse(texto);
    } catch (error) {
        console.error("Respuesta NO JSON del servidor:");
        console.error(texto);

        mostrarMensaje(
            "danger",
            "El servidor no devolvió JSON. Revisa la consola del navegador para ver el error real."
        );

        return null;
    }
}

async function cargarCursos() {
    try {
        const response = await fetch("/api/cursos/", {
            method: "GET",
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await leerRespuesta(response);

        if (!data) return;

        if (!response.ok) {
            console.error("Error al cargar cursos:", data);
            mostrarMensaje("danger", "No se pudieron cargar los cursos.");
            return;
        }

        const cursos = data.results || data;
        const tabla = document.getElementById("tablaCursos");
        tabla.innerHTML = "";

        if (!Array.isArray(cursos) || cursos.length === 0) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        No hay cursos registrados.
                    </td>
                </tr>
            `;
            return;
        }

        cursos.forEach(curso => {
            const nombre = limpiarTexto(curso.nombre);
            const descripcion = limpiarTexto(curso.descripcion);

            tabla.innerHTML += `
                <tr>
                    <td>${curso.id}</td>
                    <td>${nombre}</td>
                    <td>${descripcion}</td>
                    <td>${curso.total_inscritos || 0}</td>
                    <td>
                        <button class="btn btn-warning btn-sm"
                            onclick="editarCurso(${curso.id}, '${nombre}', '${descripcion}')">
                            Editar
                        </button>

                        <button class="btn btn-danger btn-sm"
                            onclick="eliminarCurso(${curso.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        console.error("Error al cargar cursos:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

async function guardarCurso() {
    const id = document.getElementById("cursoId").value;
    const nombre = document.getElementById("nombre").value.trim();
    const descripcion = document.getElementById("descripcion").value.trim();

    if (!nombre) {
        mostrarMensaje("warning", "El nombre del curso es obligatorio.");
        return;
    }

    const url = id ? `/api/cursos/${id}/` : "/api/cursos/";
    const method = id ? "PUT" : "POST";

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                "Authorization": "Token " + token,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                nombre: nombre,
                descripcion: descripcion
            })
        });

        const data = await leerRespuesta(response);

        if (!response.ok) {
            console.error("Error del backend al guardar:", data);
            mostrarMensaje("danger", "No se pudo guardar el curso. Revisa la consola.");
            return;
        }

        mostrarMensaje("success", id ? "Curso actualizado correctamente." : "Curso creado correctamente.");
        limpiarFormulario();
        cargarCursos();

    } catch (error) {
        console.error("Error al guardar curso:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function editarCurso(id, nombre, descripcion) {
    document.getElementById("cursoId").value = id;
    document.getElementById("nombre").value = nombre;
    document.getElementById("descripcion").value = descripcion;
}

async function eliminarCurso(id) {
    if (!confirm("¿Deseas eliminar este curso?")) {
        return;
    }

    try {
        const response = await fetch(`/api/cursos/${id}/`, {
            method: "DELETE",
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (!response.ok && response.status !== 204) {
            mostrarMensaje("danger", "No se pudo eliminar el curso.");
            return;
        }

        mostrarMensaje("success", "Curso eliminado correctamente.");
        cargarCursos();

    } catch (error) {
        console.error("Error al eliminar curso:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function limpiarFormulario() {
    document.getElementById("cursoId").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("descripcion").value = "";
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("rol");
    window.location.href = "/";
}

cargarCursos();
</script>

</body>
</html>
