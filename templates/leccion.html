{% extends "base.html" %}

{% block title %}Lecciones - Plataforma Educativa{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="mb-4">
        <h2 class="fw-bold">Lecciones del curso</h2>
        <p class="text-muted">Contenido asociado al curso seleccionado.</p>
    </div>

    <div id="mensaje" class="mb-3"></div>

    <ul id="listaLecciones" class="list-group shadow-sm"></ul>

</div>

{% endblock %}

{% block scripts %}
<script>
verificarSesion();

const token = localStorage.getItem("token");
const cursoId = "{{ leccion_id }}";

fetch("http://127.0.0.1:8000/api/lecciones/?curso=" + cursoId, {
    headers: {
        "Authorization": "Token " + token
    }
})
.then(response => {
    if (response.status === 401 || response.status === 403) {
        logout();
    }
    return response.json();
})
.then(data => {
    const lista = document.getElementById("listaLecciones");
    const mensaje = document.getElementById("mensaje");

    const lecciones = data.results || data;

    if (!Array.isArray(lecciones) || lecciones.length === 0) {
        mensaje.innerHTML = `
            <div class="alert alert-info">
                No hay lecciones registradas para este curso.
            </div>
        `;
        return;
    }

    lecciones.forEach(leccion => {
        lista.innerHTML += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>${leccion.titulo}</strong>
                    <p class="mb-0 text-muted">${leccion.contenido || ""}</p>
                </div>

                <a href="/evaluacion/${leccion.id}/" class="btn btn-success btn-sm">
                    Ver evaluación
                </a>
            </li>
        `;
    });
})
.catch(error => {
    console.error("Error:", error);
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-danger">
            No se pudieron cargar las lecciones.
        </div>
    `;
});
</script>
{% endblock %}
