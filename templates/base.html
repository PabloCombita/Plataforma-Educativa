{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Plataforma Educativa{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="/dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" width="42" height="42" class="me-2 rounded">
            <span class="fw-bold">Plataforma Educativa</span>
        </a>

        <div class="d-flex align-items-center">
            <span id="usuarioNavbar" class="text-white me-3"></span>

            <a href="/dashboard/" class="btn btn-outline-light btn-sm me-2">Inicio</a>
            <a href="/cursos/" class="btn btn-outline-light btn-sm me-2">Cursos</a>

            <button class="btn btn-danger btn-sm" onclick="logout()">
                Cerrar sesión
            </button>
        </div>

    </div>
</nav>

{% block content %}
{% endblock %}

<script>
function verificarSesion() {
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "/";
    }

    const username = localStorage.getItem("username");
    const usuarioNavbar = document.getElementById("usuarioNavbar");

    if (usuarioNavbar && username) {
        usuarioNavbar.innerText = "Usuario: " + username;
    }
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "/";
}
</script>

{% block scripts %}
{% endblock %}

</body>
</html>
