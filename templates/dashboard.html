{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Plataforma Educativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/dashboard/">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="nav-logo me-2">
            <span>Plataforma Educativa</span>
        </a>

        <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="container mt-4">

    <div class="mb-4">
        <h2 class="section-title">Panel del estudiante</h2>
        <p class="text-muted">
            Bienvenido, <span id="usuario"></span>. Aquí puedes consultar tus cursos inscritos y tu avance.
        </p>
    </div>

    <div id="mensaje"></div>

    <div class="row" id="listaCursos"></div>

</div>

<script>
const token = localStorage.getItem("token");
const username = localStorage.getItem("username");
const rol = localStorage.getItem("rol");

if (!token) {
    window.location.href = "/";
}

if (rol === "admin") {
    window.location.href = "/admin-dashboard/";
}

document.getElementById("usuario").innerText = username || "estudiante";

function mostrarMensaje(tipo, texto) {
    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-${tipo}">
            ${texto}
        </div>
    `;
}

function limpiarTexto(texto) {
    if (!texto) return "";
    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

async function leerRespuesta(response) {
    const texto = await response.text();

    if (!texto) {
        return {};
    }

    try {
        return JSON.parse(texto);
    } catch (error) {
        console.error("Respuesta NO JSON del servidor:");
        console.error(texto);
        mostrarMensaje("danger", "El servidor no devolvió JSON. Revisa la consola.");
        return null;
    }
}

async function obtenerProgreso(cursoId) {
    try {
        const response = await fetch(`/api/progreso/${cursoId}/`, {
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return null;
        }

        const data = await leerRespuesta(response);

        if (!data || !response.ok) {
            return null;
        }

        return data;

    } catch (error) {
        console.error("Error al obtener progreso:", error);
        return null;
    }
}

function obtenerEstadoCurso(progreso) {
    if (!progreso) {
        return "Sin información";
    }

    if (progreso.total_evaluaciones === 0) {
        return "Sin evaluaciones";
    }

    if (progreso.progreso >= 100) {
        return "Completado";
    }

    if (progreso.progreso > 0) {
        return "En progreso";
    }

    return "Pendiente";
}

function obtenerColorEstado(estado) {
    if (estado === "Completado") return "success";
    if (estado === "En progreso") return "primary";
    if (estado === "Pendiente") return "warning";
    return "secondary";
}

async function cargarCursosInscritos() {
    try {
        const response = await fetch("/api/cursos/", {
            headers: {
                "Authorization": "Token " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await leerRespuesta(response);

        if (!data) return;

        if (!response.ok) {
            console.error("Error al cargar cursos:", data);
            mostrarMensaje("danger", "No se pudieron cargar tus cursos.");
            return;
        }

        const cursos = data.results || data;
        const contenedor = document.getElementById("listaCursos");
        contenedor.innerHTML = "";

        if (!Array.isArray(cursos) || cursos.length === 0) {
            mostrarMensaje(
                "info",
                "Actualmente no tienes cursos inscritos. Solicita al administrador que te inscriba a un curso."
            );
            return;
        }

        for (const curso of cursos) {
            const progreso = await obtenerProgreso(curso.id);

            const porcentaje = progreso ? progreso.progreso : 0;
            const totalEvaluaciones = progreso ? progreso.total_evaluaciones : 0;
            const correctas = progreso ? progreso.correctas : 0;
            const estado = obtenerEstadoCurso(progreso);
            const colorEstado = obtenerColorEstado(estado);

            contenedor.innerHTML += `
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm h-100 module-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold mb-0">${limpiarTexto(curso.nombre || "Curso sin nombre")}</h5>
                                <span class="badge bg-${colorEstado}">
                                    ${estado}
                                </span>
                            </div>

                            <p class="text-muted">
                                ${limpiarTexto(curso.descripcion || "Sin descripción disponible.")}
                            </p>

                            <div class="mb-2">
                                <small class="text-muted">
                                    Progreso: ${porcentaje}%
                                </small>

                                <div class="progress" style="height: 10px;">
                                    <div class="progress-bar bg-${colorEstado}"
                                         role="progressbar"
                                         style="width: ${porcentaje}%;">
                                    </div>
                                </div>
                            </div>

                            <p class="text-muted text-small mb-3">
                                Evaluaciones correctas: ${correctas} de ${totalEvaluaciones}
                            </p>

                            <a href="/leccion/?curso=${curso.id}" class="btn btn-primary btn-sm">
                                Ver lecciones
                            </a>

                            <a href="/evaluacion/?curso=${curso.id}" class="btn btn-success btn-sm">
                                Ver evaluaciones
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

    } catch (error) {
        console.error("Error:", error);
        mostrarMensaje("danger", "Error al conectar con el servidor.");
    }
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("rol");
    window.location.href = "/";
}

cargarCursosInscritos();
</script>

</body>
</html>
